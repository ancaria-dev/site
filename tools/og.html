<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The source of public/og-image.png. Rendered by tools/og.ps1 at exactly
      1200x630 in headless Chrome, so this file is the design and the PNG is
      generated output. Colors and type are copied from src/styles/tokens.less
      and the hero; keep them in step by hand, since nothing here goes through
      the Vite build.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #0f0b08;
        background-image:
          radial-gradient(ellipse 900px 460px at 15% -12%, rgba(139, 26, 26, 0.34), transparent 62%),
          radial-gradient(ellipse 760px 520px at 104% 4%, rgba(201, 162, 39, 0.16), transparent 58%);
        color: #ede3d3;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .frame {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 56px 86px;
      }

      .eyebrow {
        margin: 0 0 22px;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: #c9a227;
      }

      .title {
        margin: 0 0 30px;
        max-width: 1010px;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 74px;
        font-weight: 600;
        line-height: 1.14;
        letter-spacing: 0.01em;
        background: linear-gradient(160deg, #ede3d3 20%, #e8c869 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lede {
        margin: 0;
        max-width: 890px;
        font-size: 25px;
        line-height: 1.62;
        color: #a99a86;
      }
    </style>
    <title>Ancaria for Developers</title>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Ancaria for Developers</p>
      <h1 class="title">Sacred Gold, twenty years later, modded again</h1>
      <p class="lede">
        A proof-of-concept mod-loading ecosystem for Sacred Gold. Write mods in Kotlin, Java, or
        Groovy against an event API, run them alongside the game, and never touch a single file on
        disk.
      </p>
    </div>
  </body>
</html>
