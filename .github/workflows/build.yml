name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack goes first on purpose. setup-node v5 caches by default and
      # reads packageManager from package.json to decide how, so it fails on
      # "Unable to locate executable file: pnpm" if pnpm is enabled after it.
      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

      # This job uploads what it just built and linted; Cloudflare runs no
      # build step of its own. The target is the assets-only Worker described
      # in wrangler.jsonc, which is what ancaria.dev is routed to.
      #
      # wrangler runs through npx rather than cloudflare/wrangler-action: the
      # action installs wrangler with whatever package manager the repository
      # uses, and pnpm 12 refuses that install outright (ERR_PNPM_IGNORED_BUILDS)
      # over the build scripts of esbuild and workerd. npm runs those scripts,
      # which wrangler needs to work at all.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy
