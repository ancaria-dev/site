name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack goes first on purpose. setup-node v5 caches by default and
      # reads packageManager from package.json to decide how, so it fails on
      # "Unable to locate executable file: pnpm" if pnpm is enabled after it.
      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

      # Cloudflare Pages is configured for direct upload here, not its own
      # build step: this job builds dist/ once and hands it over, so what
      # Cloudflare serves is exactly what CI just built and linted.
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/master'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ancaria-site
